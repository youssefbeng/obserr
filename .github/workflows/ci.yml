name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, Clippy, Tests & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust integration tests
        run: cargo test

      - name: Run Airflow listener tests (Python 3.10 & 3.12 + docstring check)
        run: |
          uv run --project integrations/airflow --python 3.10 pytest integrations/airflow/tests
          uv run --project integrations/airflow --python 3.12 pytest integrations/airflow/tests

      - name: Run local binary smoke test
        run: ./sandbox/smoke_test.sh
